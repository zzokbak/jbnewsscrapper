<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쪽박탈출! 주식뉴스 수집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E11;
    --panel:#12161B;
    --line:#232A31;
    --ink:#E8E6DF;
    --mute:#8B939B;
    --up:#D64545;      /* 한국 증시 관행: 상승/강조 = 적색 */
    --down:#3B82C4;    /* 하락/보조 = 청색 */
    --amber:#E8A93A;   /* 티커 앰버 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    padding-left:184px; /* 왼쪽 시장지표 사이드바 자리 확보 (160px 기준 한글 2자 여유) */
  }
  h1,h2,.serif{font-family:'Noto Serif KR', serif;}

  /* ---- 왼쪽 고정 시장지표 사이드바 (세로 방향, 항목 간 간격 최소) ---- */
  #marketSidebar{
    position:fixed; left:0; top:0; bottom:0; width:184px;
    background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; overflow-x:hidden; padding:10px 8px;
    display:flex; flex-direction:column; gap:1px;
    z-index:40; scrollbar-width:thin;
  }
  #marketSidebar::-webkit-scrollbar{ width:4px; }
  #marketSidebar .mkt{ padding:1px 0; }
  #marketSidebar .mkt-divider{
    font-size:10px; color:var(--amber); font-weight:700; letter-spacing:.03em;
    margin:8px 0 3px; padding-top:8px; border-top:1px solid var(--line);
  }
  @media (max-width:480px){
    body{ padding-left:132px; }
    #marketSidebar{ width:132px; padding:8px 5px; }
    #marketSidebar .mkt{ font-size:9.5px !important; }
  }

  /* ---- 상단 티커: 속보(스크롤) 줄 ---- */
  .tape-wrap{
    background:var(--bg); border-bottom:1px solid var(--line);
    overflow:hidden; position:relative;
  }
  .tape-row{
    overflow:hidden; white-space:nowrap; height:30px;
  }
  .tape-row + .tape-row{ border-top:1px solid var(--line); }

  .mkt{ display:flex; align-items:baseline; gap:4px; font-size:11px !important; white-space:nowrap; }
  .mkt .mkt-name{ color:var(--mute); }
  .mkt .mkt-val{ color:var(--ink); font-weight:600; }
  .mkt .mkt-chg.up{ color:var(--up); }
  .mkt .mkt-chg.down{ color:var(--down); }
  .mkt .mkt-chg.flat{ color:var(--mute); }
  .mkt .mkt-dot{ color:var(--mute); margin-left:2px; }

  /* 3번째 줄: 속보 - 계속 옆으로 흐름 */
  .tape{
    display:inline-block; padding-left:100%;
    animation:scroll 56s linear infinite;
    color:var(--amber); font-weight:600; font-size:13px; line-height:30px; letter-spacing:.03em;
  }
  .tape span{margin-right:48px;}
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
  @media (prefers-reduced-motion: reduce){ .tape{animation:none; padding-left:16px;} }

  header{
    padding:28px 24px 18px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:10px;
  }
  header .title-block{ width:100%; text-align:center; }
  header h1{font-size:26px; margin:0; font-weight:900; letter-spacing:-.01em;}
  header h1 .version{font-size:10px; font-weight:400; color:var(--mute); letter-spacing:0; margin-left:4px;}
  header .sub{color:var(--mute); font-size:12.5px; margin-top:4px;}
  .status{width:100%; font-size:12px; color:var(--mute); text-align:right;}
  .status b{color:var(--amber); font-weight:600;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--up); margin-right:6px; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .controls{
    padding:14px 24px; border-bottom:1px solid var(--line);
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end;
  }
  .btn{
    border:1px solid var(--amber); background:transparent; color:var(--amber);
    padding:7px 14px; border-radius:2px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{background:var(--amber); color:var(--bg);}
  .diag{color:var(--mute); font-size:11px; margin-right:auto;}

  /* ---- 언론사 탭 ---- */
  .tabs{
    max-width:900px; margin:0 auto; padding:16px 24px 0;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .tab{
    border:1px solid var(--line); background:var(--panel); color:var(--mute);
    padding:7px 14px; border-radius:2px 2px 0 0; font-size:12.5px; cursor:pointer;
    font-family:inherit; user-select:none; white-space:nowrap;
  }
  .tab .count{color:var(--mute); font-size:10.5px; margin-left:5px;}
  .tab.active{color:var(--bg); background:var(--amber); border-color:var(--amber); font-weight:600;}
  .tab.active .count{color:#00000099;}

  main{max-width:900px; margin:0 auto; padding:0 24px 60px; border-top:1px solid var(--line);}
  .empty{padding:60px 0; text-align:center; color:var(--mute); font-size:13px;}

  .item{
    display:grid; grid-template-columns:64px 1fr auto; gap:16px; align-items:start;
    padding:16px 0; border-bottom:1px solid var(--line);
  }
  .item .time{color:var(--mute); font-size:11px; padding-top:3px;}
  .item a.title{color:var(--ink); text-decoration:none; font-size:15.5px; line-height:1.5; font-weight:500;}
  .item a.title:hover{color:var(--amber); text-decoration:underline;}
  .item .src{color:var(--mute); font-size:11.5px; margin-top:5px;}
  .item .src .paid-tag{color:var(--amber);}
  .copy-btn{
    background:none; border:1px solid var(--line); color:var(--mute); cursor:pointer;
    width:30px; height:30px; border-radius:2px; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .copy-btn:hover{border-color:var(--amber); color:var(--amber);}
  .copy-btn.copied{border-color:var(--up); color:var(--up);}
  .copy-btn svg{width:15px; height:15px;}
  .item-actions{display:flex; align-items:center; gap:6px; margin-top:2px;}
  .premium-badge{
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid #A78BFA; color:#A78BFA; font-size:10px; font-weight:600;
    border-radius:2px; padding:5px 6px; line-height:1; white-space:nowrap;
  }

  /* 제목에 '속보'가 포함된 기사는 연분홍 배경으로 강조 */
  .item.breaking{
    background:#FFD9EA; margin:0 -14px; padding:16px 14px; border-radius:4px; border-bottom-color:#FFC2DE;
  }
  .item.breaking .time{ color:#8A3B60; }
  .item.breaking a.title{ color:#4A0E2C; }
  .item.breaking a.title:hover{ color:#B0125F; }
  .item.breaking .src{ color:#8A3B60; }
  .item.breaking .copy-btn{ border-color:#B0125F55; color:#8A3B60; }
  .item.breaking .copy-btn:hover{ border-color:#B0125F; color:#B0125F; }

  /* 기사 제목에 마우스를 올리면 나타나는 큰 미리보기 창 */
  #previewPanel{
    position:fixed; right:24px; bottom:24px; width:min(440px, 90vw); max-height:60vh;
    background:var(--panel); border:1px solid var(--amber); border-radius:6px;
    box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .15s ease, transform .15s ease; z-index:999;
  }
  #previewPanel.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #previewPanel .pv-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 0; flex:0 0 auto;
  }
  #previewPanel .pv-src{ color:var(--amber); font-size:11px; font-weight:600; }
  #previewPanel .pv-scroll{ flex:1 1 auto; overflow-y:auto; padding:8px 16px 4px; }
  #previewPanel .pv-footer{
    flex:0 0 auto; padding:8px 14px; display:flex; justify-content:flex-end;
    border-top:1px solid var(--line);
  }
  #previewPanel .pv-close-btn, #previewPanel .pv-copy-btn{
    background:none; border:1px solid var(--line); color:var(--mute); cursor:pointer;
    width:26px; height:26px; border-radius:2px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  #previewPanel .pv-close-btn:hover{ border-color:var(--up); color:var(--up); }
  #previewPanel .pv-copy-btn:hover{ border-color:var(--amber); color:var(--amber); }
  #previewPanel .pv-close-btn svg, #previewPanel .pv-copy-btn svg{ width:13px; height:13px; }
  #previewPanel .pv-title{ font-family:'Noto Serif KR', serif; font-size:16px; font-weight:700; margin-bottom:10px; line-height:1.4; }
  #previewPanel .pv-body{ color:var(--ink); font-size:13px; line-height:1.7; white-space:pre-line; }
  #previewPanel .pv-loading{ color:var(--mute); font-size:12.5px; }

  footer{color:var(--mute); font-size:11px; text-align:center; padding:24px; border-top:1px solid var(--line);}
</style>
</head>
<body>

<div id="marketSidebar"></div>

<div class="tape-wrap">
  <div class="tape-row"><div class="tape" id="tape3"></div></div>
</div>

<header>
  <div class="title-block">
    <h1>쪽박탈출! 주식뉴스 수집기 <span class="version">Ver 1.0</span></h1>
    <div class="sub">(주식 관련 뉴스 자동 수집 · 최신순 정렬)</div>
  </div>
  <div class="status">
    <div><span class="dot"></span>자동 갱신 <b>ON</b> · 5분 주기</div>
    <div id="lastUpdated">마지막 갱신 — 불러오는 중…</div>
    <div id="naverQuota" style="font-size:10.5px;"></div>
  </div>
</header>

<div class="controls">
  <span class="diag" id="diag"></span>
</div>

<div id="contentArea">
  <div class="tabs" id="tabs"></div>

  <main>
    <div id="list"><div class="empty">뉴스를 불러오는 중입니다…</div></div>
  </main>
</div>

<footer>이 페이지는 각 언론사가 공개한 RSS 피드를 표시만 합니다. 기사 본문은 원문 링크에서 확인하세요.</footer>

<div id="previewPanel"></div>

<script>
// 관리자만 수정하는 검색 키워드 (화면에는 표시되지 않음, 기사 필터링에만 사용)

// 이 자체로 이미 증시 관련이라 확실한 키워드 — 이것만 있으면 바로 수집
const STRONG_MARKET_KEYWORDS = ["실적발표","리밸런싱","주식","주가","증권","애널리스트","월가","CXMT","창신메모리","창신 메모리","관리종목","N2 모닝 경제 브리핑"];

// 증시 아닌 곳에서도 자주 쓰이는 애매한 키워드 — 아래 "증시 맥락 단어"가 같이 있을 때만 수집
// (예: "안드로이드"만 있으면 그냥 스마트폰 뉴스일 수 있어서, "주가"·"상장" 같은 증시 단어가 같이 있어야 통과)
const CONTEXT_REQUIRED_KEYWORDS = ["반도체","로봇","안드로이드","임상실험","메모리","호르무즈"];

// 위 애매한 키워드들과 함께 있어야 "진짜 증시 뉴스"로 인정하는 맥락 단어
const MARKET_CONTEXT_TERMS = ["주식","증권","주가","코스피","코스닥","나스닥","다우","시황","증시","매수","매도","급등","급락","실적","상장","공시","시가총액","외국인","기관","개인투자자","투자","펀드","ETF","금리","환율"];

// 두 단어가 "같이" 나올 때만 수집하는 조합 (삼성/하이닉스는 이름만으론 노이즈가 너무 많아 이렇게 좁혀서 씀)
// 이 조합들도 증시 맥락 단어가 같이 있어야 최종 통과됨
const KEYWORD_AND_GROUPS = [
  ["삼성","계약"],
  ["하이닉스","계약"],
  ["삼성","주가"],
  ["하이닉스","주가"],
];

// 아래 조합들은 그 자체로 이미 증시 뉴스로 인정 — 별도 맥락 단어 없이 바로 통과
// (임상실험 성공/실패는 바이오주 주가에 직결, 메모리·로봇 계약은 실적 관련 뉴스, 호르무즈 해협 상황은 유가/에너지주에 직결)
const KEYWORD_AND_GROUPS_STRONG = [
  ["임상실험","성공"],
  ["임상실험","실패"],
  ["메모리","계약"],
  ["로봇","계약"],
  ["호르무즈","개방"],
  ["호르무즈","폐쇄"],
  ["호르무즈","통과"],
  ["호르무즈","피격"],
  ["창신","계약"],
  ["CXMT","계약"],
  ["TSMC","계약"],
  ["유가","상승"],
  ["유가","하락"],
];

// 포털 검색(네이버·다음)에 실제로 보낼 검색어 목록에는 애매한 키워드까지 전부 포함 (검색 자체는 넓게, 최종 필터링에서 좁힘)
const KEYWORDS = [...STRONG_MARKET_KEYWORDS, ...CONTEXT_REQUIRED_KEYWORDS];

// 언론사별 증권/경제 RSS. 구글 뉴스 검색 RSS는 클라우드 서버 IP를 차단하는 경우가 많아
// 안정성이 떨어져서, 언론사가 직접 제공하는 RSS로 대체했습니다.
// 아래 두 곳은 실제로 접속해 데이터가 오는 것까지 확인한 주소입니다.
// 다른 언론사를 추가하고 싶으면 "언론사명 RSS 주소"로 검색해 최신 주소를 확인한 뒤 이 배열에 추가하세요.
const SOURCES = [
  { name: "한국경제",   url: "https://www.hankyung.com/feed/finance" },
  { name: "파이낸셜뉴스", url: "https://www.fnnews.com/rss/r20/fn_realnews_stock.xml" },
  { name: "파이낸셜뉴스", url: "https://www.fnnews.com/rss/r20/fn_realnews_economy.xml" },
  { name: "파이낸셜뉴스", url: "https://www.fnnews.com/rss/r20/fn_realnews_finance.xml" },
  { name: "뉴시스",     url: "https://www.newsis.com/RSS/bank.xml" },    // 금융 섹션
  { name: "뉴시스",     url: "https://www.newsis.com/RSS/economy.xml" }, // 경제 섹션 — 둘을 합쳐서 최대 10개, 한쪽이 필터로 많이 걸러지면 다른 쪽에서 자동으로 채워짐
];

// 해외 소스: 로이터는 2020년경 공개 RSS를 완전히 폐지해서 제외했습니다(공식 피드 없음, 지금 나오는 건 전부 비공식 스크래핑 서비스라 신뢰하기 어려움).
// 블룸버그·폭스비즈니스는 실제 접속해 데이터가 오는 것을 확인한 주소입니다.
// 폭스비즈니스는 markets/economy 섹션 피드만으로는 갱신이 뜸해서, 전체 헤드라인(latest) 피드를 추가해 최신성을 높였습니다.
const SOURCES_EN = [
  { name: "Bloomberg",     url: "https://feeds.bloomberg.com/markets/news.rss" },
  { name: "Fox Business",  url: "https://moxie.foxbusiness.com/google-publisher/latest.xml" },
  { name: "Fox Business",  url: "https://moxie.foxbusiness.com/google-publisher/markets.xml" },
  { name: "Fox Business",  url: "https://moxie.foxbusiness.com/google-publisher/economy.xml" },
];

// 한글 키워드 → 영어 키워드 매핑 (해외 소스 필터링용)
const KEYWORDS_EN = ["Samsung","SK Hynix","Hynix","earnings","rebalancing","stock","shares","securities","analyst","Wall Street","semiconductor","chip","robot","Android","clinical trial","memory chip","Hormuz"];

// 네이버·다음 포털 검색: 구글 뉴스와 달리 무료 공개 RSS가 없어서, 각 포털의 공식 오픈 API를 씁니다.
// API 키(Client ID/Secret)는 브라우저에 노출하면 안 되므로 Worker 안에서만 사용합니다.
// 아래 스위치를 true로 바꾸면 시도합니다 — 단, Worker에 먼저 키를 등록해야 동작합니다 (안내 참고).
const USE_PORTAL_SEARCH = true;

const REFRESH_MS = 5 * 60 * 1000; // 5분 (3명이 각자 브라우저를 켜두는 걸 감안해 네이버 무료 한도의 약 60%만 쓰도록 여유있게 설정)
const MAX_ITEMS = 160;
const PER_SOURCE_MAX = 20; // 탭(언론사)마다 최대 20개까지만
const PER_SOURCE_MAX_OVERRIDES = { "Bloomberg": 10 }; // 특정 언론사만 다르게 제한하고 싶을 때
function getSourceMax(name){ return PER_SOURCE_MAX_OVERRIDES[name] || PER_SOURCE_MAX; }

// 1순위: 본인 소유의 Cloudflare Worker 프록시
const MY_WORKER = "https://stock-news.zzokbak.workers.dev";

// 2순위: 백업용 공개 프록시 (본인 워커가 일시적으로 안 될 때만 시도)
const PROXIES = [
  ...(MY_WORKER ? [url => MY_WORKER + "/?url=" + encodeURIComponent(url)] : []),
  url => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(url),
];

const PROXY_TIMEOUT_MS = 12000; // 프록시 하나당 12초 넘으면 포기하고 다음으로 (블룸버그 등 일부 해외 소스가 느릴 때 대비)

let allItems = [];        // 키워드 필터를 통과한 전체 기사 {title, link, pubDate, source}
let renderedItems = [];   // 현재 화면에 그려진 기사 목록 (복사 버튼이 참조)
let activeTab = "ALL";
let failedSources = [];

async function fetchWithProxies(targetUrl){
  let lastError = "";
  for(const build of PROXIES){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), PROXY_TIMEOUT_MS);
    try{
      const res = await fetch(build(targetUrl), { signal: controller.signal });
      clearTimeout(timer);
      if(res.ok){
        const text = await res.text();
        if(text && text.includes("<item")) return text;
        lastError = "빈 응답";
      }else{
        lastError = "HTTP " + res.status;
      }
    }catch(e){
      clearTimeout(timer);
      lastError = e.name === "AbortError" ? "시간 초과" : e.message;
    }
  }
  throw new Error(lastError || "모든 프록시 실패");
}

function normalizeTitle(t){
  return t.replace(/\s*[-–]\s*[^-–]{1,20}$/,"").replace(/\s+/g,"").toLowerCase();
}

function matchesKeyword(text){
  if(!text) return false;
  return KEYWORDS.some(k => text.includes(k));
}

function hasMarketContext(text){
  return MARKET_CONTEXT_TERMS.some(k => text.includes(k));
}

// 본문에서 증시 관련 핵심 문장만 추려서 짧게 함축 (스크롤 없이 패널 안에 들어가도록)
function condenseMarketText(text){
  if(!text) return text;
  const relevantTerms = [...STRONG_MARKET_KEYWORDS, ...CONTEXT_REQUIRED_KEYWORDS, ...MARKET_CONTEXT_TERMS];
  const sentences = text.split(/(?<=[.!?다요])\s+/).map(s => s.trim()).filter(Boolean);
  const relevant = sentences.filter(s => relevantTerms.some(k => s.includes(k)));
  // 증시 관련 문장이 있으면 그것만, 없으면 전체 원문을 그대로 반환 (끝을 자르지 않음)
  return relevant.length ? relevant.join(" ") : text;
}

// 제목+본문을 합쳐서 봐야 "삼성"은 제목에, "계약"은 본문에 있는 경우도 잡을 수 있음
function matchesAnyKeyword(item){
  const combined = ((item.title || "") + " " + (item.description || "")).toLowerCase();

  // 1. 그 자체로 확실한 증시 키워드면 바로 통과 (CXMT 같은 영문 표기 대소문자 무관하게 처리)
  if(STRONG_MARKET_KEYWORDS.some(k => combined.includes(k.toLowerCase()))) return true;

  // 1-0. "소버린 AI" / "모두의 AI" — 띄어쓰기가 있든 없든 매칭되도록 정규식으로 처리
  if(/소버린\s*ai|모두의\s*ai/i.test(combined)) return true;

  // 1-1. 사용자가 지정한 "이미 증시 뉴스로 확실한" 조합도 맥락 단어 없이 바로 통과
  if(KEYWORD_AND_GROUPS_STRONG.some(group => group.every(k => combined.includes(k.toLowerCase())))) return true;

  // 2. 애매한 키워드는 증시 맥락 단어가 같이 있어야 통과 (주식/증권 뉴스가 아니면 걸러냄)
  const hasAmbiguous = CONTEXT_REQUIRED_KEYWORDS.some(k => combined.includes(k.toLowerCase()));
  if(hasAmbiguous && hasMarketContext(combined)) return true;

  // 3. 삼성/하이닉스 + 계약 같은 조합도 증시 맥락 단어가 같이 있어야 최종 통과
  const hasGroup = KEYWORD_AND_GROUPS.some(group => group.every(k => combined.includes(k.toLowerCase())));
  if(hasGroup && hasMarketContext(combined)) return true;

  return false;
}

function matchesKeywordEn(text){
  if(!text) return false;
  const lower = text.toLowerCase();
  return KEYWORDS_EN.some(k => lower.includes(k.toLowerCase()));
}

function isExcludedNoise(item){
  const combined = (item.title || "") + " " + (item.description || "");
  if(!combined.trim()) return false;
  const combinedLower = combined.toLowerCase();

  // 뉴스가 아닌 커뮤니티/포럼 출처는 링크 도메인으로 걸러냄 (다음 웹문서 검색에서 종종 섞여 들어옴)
  const link = (item.link || "").toLowerCase();
  if(/dcinside\.com/.test(link)) return true;
  if(/isplus\.com/.test(link)) return true; // 일간스포츠
  if(/topstarnews\.net/.test(link)) return true;
  if(/polinews/.test(link)) return true;
  if(/ebn\.co\.kr/.test(link)) return true;

  const isPresidentDeath = /대통령/.test(combined) && /(사망|서거|타계)/.test(combined);
  if(isPresidentDeath) return false; // 예외: 대통령 사망/서거 소식은 통과

  if(NOISE_SINGLE_TERMS.some(k => combinedLower.includes(k.toLowerCase()))) return true;
  if(NOISE_AND_GROUPS.some(group => group.every(k => combined.includes(k)))) return true;

  // "정치"·"공천"은 증시/금융 맥락 단어가 함께 없을 때만 제외 (정치 이슈가 실제 증시에 영향을 준 기사는 통과시킴)
  if(combined.includes("정치") || combined.includes("공천")){
    const hasMarket = STRONG_MARKET_KEYWORDS.some(k => combinedLower.includes(k.toLowerCase())) || hasMarketContext(combined);
    if(!hasMarket) return true;
  }

  // 상속·친자·유언 중 2개 이상이 같이 나오면 (유산 분쟁 등 법조 기사) 제외
  const inheritanceHits = ["상속","친자","유언"].filter(k => combined.includes(k)).length;
  if(inheritanceHits >= 2) return true;

  // "중국" 일반 뉴스는 제외하되, CXMT·창신메모리 관련 기사는 예외적으로 허용
  const isChinaMemoryException = /cxmt/i.test(combined) || /창신\s?메모리/.test(combined);
  if(combined.includes("중국") && !isChinaMemoryException) return true;

  return false;
}

function resolvePress(link){
  try{
    const host = new URL(link).hostname.toLowerCase();
    for(const [frag, name] of PRESS_DOMAIN_MAP){
      if(host.includes(frag)) return name;
    }
    return host.replace(/^www\./,"").replace(/^news\./,""); // 매핑에 없으면 도메인이라도 표시
  }catch(e){
    return null;
  }
}

function stripHtml(html){
  if(!html) return "";
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || "").replace(/\s+/g," ").trim();
}

const translateCache = {}; // 같은 문장을 여러 번 번역 요청하지 않도록 캐시
// ---- 번역: 무료 사이트를 여러 개 순서대로 시도 (하나가 한도 초과/실패하면 다음으로) ----

async function tryMyMemory(chunk){
  const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(chunk) + "&langpair=en|ko");
  const data = await res.json();
  let translated = data?.responseData?.translatedText;
  // MyMemory는 하루 무료 한도를 넘으면 에러 코드 대신 영어 경고문을 번역 결과인 것처럼 끼워 보낸다 — 감지해서 실패로 처리
  if(translated && /MYMEMORY WARNING|LIMIT.*EXCEEDED|USED ALL AVAILABLE FREE TRANSLATIONS/i.test(translated)){
    throw new Error("MyMemory 일일 한도 초과");
  }
  if(!translated) throw new Error("MyMemory 응답 없음");
  return translated;
}

async function tryGoogleUnofficial(chunk){
  const target = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=" + encodeURIComponent(chunk);
  const res = await fetch(MY_WORKER + "/?url=" + encodeURIComponent(target));
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const segments = data?.[0];
  if(!Array.isArray(segments)) throw new Error("구글(비공식) 응답 형식 이상");
  const translated = segments.map(seg => seg?.[0]).filter(Boolean).join("");
  if(!translated) throw new Error("구글(비공식) 번역 결과 없음");
  return translated;
}

async function tryLingva(chunk){
  const target = "https://lingva.ml/api/v1/en/ko/" + encodeURIComponent(chunk);
  const res = await fetch(MY_WORKER + "/?url=" + encodeURIComponent(target));
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if(!data?.translation) throw new Error("Lingva 응답 형식 이상");
  return data.translation;
}

async function tryGoogleDict(chunk){
  const target = "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=ko&q=" + encodeURIComponent(chunk);
  const res = await fetch(MY_WORKER + "/?url=" + encodeURIComponent(target));
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  // 이 엔드포인트는 응답 모양이 [["번역문", ...], ...] 또는 {sentences:[{trans:"..."}]} 등으로 다양해서 방어적으로 파싱
  const translated = Array.isArray(data) ? data.flat(2).find(v => typeof v === "string")
    : data?.sentences?.map(s => s.trans).join("");
  if(!translated) throw new Error("구글 사전 API 응답 형식 이상");
  return translated;
}

const TRANSLATE_PROVIDERS = [
  { name: "MyMemory", fn: tryMyMemory },
  { name: "구글(비공식)", fn: tryGoogleUnofficial },
  { name: "Lingva", fn: tryLingva },
  { name: "구글 사전 API", fn: tryGoogleDict },
];

async function translateToKo(text){
  if(!text) return "";
  if(translateCache[text]) return translateCache[text];
  const chunk = text.slice(0, 480); // 각 서비스 1회 요청 글자수 제한 대비

  for(const provider of TRANSLATE_PROVIDERS){
    try{
      const translated = await provider.fn(chunk);
      translateCache[text] = translated;
      return translated;
    }catch(e){
      console.error(`[번역 · ${provider.name}] 실패, 다음 서비스로 대체 시도:`, e);
    }
  }
  return "(무료번역 4곳 모두 실패)\n\n" + text;
}

async function fetchSource(source){
  const xmlText = await fetchWithProxies(source.url);
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const items = Array.from(doc.querySelectorAll("item"));
  return items.map(it => ({
    title: it.querySelector("title")?.textContent?.trim() || "(제목 없음)",
    link: it.querySelector("link")?.textContent?.trim() || "#",
    pubDate: new Date(it.querySelector("pubDate")?.textContent || Date.now()),
    description: stripHtml(it.querySelector("description")?.textContent?.trim() || ""),
    source: source.name,
    lang: "ko"
  }));
}

async function fetchSourceEn(source){
  const xmlText = await fetchWithProxies(source.url);
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const items = Array.from(doc.querySelectorAll("item"));
  const matched = items
    .map(it => ({
      titleEn: it.querySelector("title")?.textContent?.trim() || "",
      link: it.querySelector("link")?.textContent?.trim() || "#",
      pubDate: new Date(it.querySelector("pubDate")?.textContent || Date.now()),
      descriptionEn: stripHtml(it.querySelector("description")?.textContent?.trim() || ""),
      source: source.name,
      lang: "en"
    }))
    .filter(it => matchesKeywordEn(it.titleEn) || matchesKeywordEn(it.descriptionEn));

  // 제목만 미리 번역 (본문은 마우스를 올렸을 때 그때그때 번역)
  await Promise.all(matched.map(async it => {
    it.title = await translateToKo(it.titleEn);
    it.description = it.descriptionEn; // 원문 유지, 호버 시 번역
  }));
  return matched;
}

// 네이버 뉴스 검색 (Worker가 /?naver_query=키워드 로 프록시)

  let res;
  try{

      description: stripHtml(it.description || ""),
      source: "네이버",
      press: resolvePress(link),

function delay(ms){ return new Promise(res => setTimeout(res, ms)); }

// 네이버·다음은 검색 API라 "삼성 계약"처럼 두 단어를 붙여서 검색어 자체로 보낼 수 있음
const PORTAL_QUERIES = [
  ...KEYWORDS,
  ...KEYWORD_AND_GROUPS.map(group => group.join(" ")), // ["삼성","계약"] → "삼성 계약"
];

async function fetchPortal(fetchFn, label){
  let merged = [];
  let failCount = 0;
  for(let i = 0; i < PORTAL_QUERIES.length; i++){
    try{
      const items = await fetchFn(PORTAL_QUERIES[i]);
      merged = merged.concat(items);
    }catch(e){
      failCount++;
      console.error(`[${label} · ${PORTAL_QUERIES[i]}] 실패:`, e);
    }
    if(i < PORTAL_QUERIES.length - 1) await delay(250); // 한꺼번에 몰아서 보내지 않도록 약간의 간격을 둠 (버스트 차단 방지)
  }
  if(failCount === PORTAL_QUERIES.length) throw new Error(`${label} 전체 실패`); // 전부 실패하면 소스 자체가 죽은 것으로 처리
  return merged;
}

let isLoadingNews = false;
let lastBloombergFetch = 0;
const BLOOMBERG_INTERVAL_MS = 60 * 60 * 1000; // 블룸버그는 1시간에 한 번만 새로 검색 (기존에 모아둔 건 계속 남아있음)

async function loadAll(){
  if(isLoadingNews) return; // 이전 주기가 아직 안 끝났으면 겹쳐서 실행하지 않음
  isLoadingNews = true;
  try{
    document.getElementById("lastUpdated").textContent = "마지막 갱신 — 불러오는 중…";
    const dueForBloomberg = (Date.now() - lastBloombergFetch) >= BLOOMBERG_INTERVAL_MS;
    const allSources = [...SOURCES.map(s => ({...s, lang:"ko"})), ...SOURCES_EN.map(s => ({...s, lang:"en"}))]
      .filter(s => s.name !== "Bloomberg" || dueForBloomberg); // 블룸버그는 때가 안 됐으면 이번 주기에서 통째로 제외
    if(dueForBloomberg) lastBloombergFetch = Date.now();
    const fetchTasks = allSources.map(s => s.lang === "en" ? fetchSourceEn(s) : fetchSource(s));

    // 네이버·다음 포털 검색 (Worker에 API 키가 등록돼 있을 때만 시도)
    const portalNames = [];
    if(USE_PORTAL_SEARCH && MY_WORKER){
      trackNaverUsage(PORTAL_QUERIES.length).then(renderNaverQuota);
      fetchTasks.push(fetchPortal(fetchNaverKeyword, "네이버")); portalNames.push("네이버");
      fetchTasks.push(fetchPortal(fetchDaumKeyword, "다음"));   portalNames.push("다음");
    }

    const results = await Promise.allSettled(fetchTasks);
    let mergedKo = [];
    let mergedEn = [];
    failedSources = [];
    results.forEach((r, idx) => {
      const isPortal = idx >= allSources.length;
      const name = isPortal ? portalNames[idx - allSources.length] : allSources[idx].name;
      const lang = isPortal ? "ko" : allSources[idx].lang;
      if(r.status === "fulfilled"){
        if(lang === "en") mergedEn = mergedEn.concat(r.value);
        else mergedKo = mergedKo.concat(r.value);
      }else{
        failedSources.push(name);
        console.error(`[${name}] 로딩 실패:`, r.reason);
      }
    });
    document.getElementById("diag").textContent =
      failedSources.length ? `일부 언론사 로딩 실패: ${failedSources.join(", ")}` : "";

    // 국내 소스는 한글 키워드로 필터(포털 검색은 이미 키워드로 검색했으니 그대로 통과), 해외 소스는 fetchSourceEn 단계에서 이미 필터됨
    const filteredKo = mergedKo.filter(item => matchesAnyKeyword(item));
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;
    const filtered = filteredKo.concat(mergedEn)
      .filter(item => !isExcludedNoise(item))
      .filter(item => (Date.now() - item.pubDate.getTime()) <= ONE_DAY_MS); // 전날 이전(24시간 초과) 뉴스는 제외
    filtered.forEach(item => {
      // 한글 "속보" 또는 영문 원제목의 "BREAKING" 둘 다 속보로 인정
      const enBreaking = item.lang === "en" && item.titleEn && /\bbreaking\b/i.test(item.titleEn);
      if(item.title.includes("속보") || enBreaking) item.isBreaking = true;
    });

    // 중복 제거 — 이번에 새로 가져온 것 + 기존에 이미 갖고 있던 것을 합쳐서 처리
    // (매번 전체를 지우고 새로 채우는 대신, 겹치는 건 걸러내고 진짜 새 기사만 누적)
    const combinedPool = filtered.concat(allItems)
      .filter(item => (Date.now() - item.pubDate.getTime()) <= ONE_DAY_MS); // 병합 후에도 24시간 넘은 건 계속 걸러냄
    const seen = new Set();
    const deduped = [];
    for(const item of combinedPool.sort((a,b)=>b.pubDate-a.pubDate)){
      const key = normalizeTitle(item.title);
      if(seen.has(key) || seen.has(item.link)) continue;
      seen.add(key); seen.add(item.link);
      deduped.push(item);
    }

    // 탭(언론사)마다 최대 개수까지만 (네이버가 압도적으로 많이 잡히는 것 방지, 블룸버그는 10개로 예외)
    const sourceCounts = {};
    const capped = [];
    for(const item of deduped){
      const c = sourceCounts[item.source] || 0;
      if(c >= getSourceMax(item.source)) continue;
      sourceCounts[item.source] = c + 1;
      capped.push(item);
    }

    allItems = capped.slice(0, MAX_ITEMS);
    buildTabs();
    render();
    updateTape();
    lastLoadTime = Date.now();
    const now = new Date();
    document.getElementById("lastUpdated").textContent =
      "마지막 갱신 — " + now.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"});
  }finally{
    isLoadingNews = false;
  }
}

// 탭 표시 순서 고정 (목록에 없는 소스는 뒤로 밀림)
const TAB_ORDER = ["네이버","다음","한국경제","파이낸셜뉴스","뉴시스","Bloomberg","Fox Business"];

function buildTabs(){
  const counts = {};
  allItems.forEach(i => { counts[i.source] = (counts[i.source] || 0) + 1; });

  const sourceTabs = Object.keys(counts).sort((a,b) => {
    const ia = TAB_ORDER.indexOf(a), ib = TAB_ORDER.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  if(!sourceTabs.includes(activeTab) && activeTab !== "ALL") activeTab = "ALL";

  const tabsEl = document.getElementById("tabs");
  const allTab = `<button class="tab ${activeTab==='ALL'?'active':''}" data-tab="ALL">전체<span class="count">${allItems.length}</span></button>`;
  const rest = sourceTabs.map(name =>
    `<button class="tab ${activeTab===name?'active':''}" data-tab="${name}">${name}<span class="count">${counts[name]}</span></button>`
  ).join("");
  tabsEl.innerHTML = allTab + rest;

  tabsEl.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeTab = btn.dataset.tab;
      buildTabs();
      render();
    });
  });
}

function render(){
  const list = document.getElementById("list");
  renderedItems = activeTab === "ALL" ? allItems : allItems.filter(i => i.source === activeTab);

  if(renderedItems.length === 0){
    list.innerHTML = '<div class="empty">뉴스를 불러오지 못했습니다. 상단 진단 메시지를 확인하거나 잠시 후 새로고침 해보세요.</div>';
    return;
  }

  const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  // 한국경제 "투자 인사이트" 시리즈는 유료 구독 기사라 본문을 다 볼 수 없어서 표시해줌
  function srcLabel(i){
    const isPaidHankyung = i.source === "한국경제" &&
      ((i.title || "").includes("투자 인사이트") || (i.description || "").includes("투자 인사이트"));
    const base = i.press || i.source;
    return isPaidHankyung ? `${base} <span class="paid-tag">(유료기사)</span>` : base;
  }

  // "한경 프리미엄" 유료 기사는 링크복사 버튼 왼쪽에 작은 보라색 "유료" 배지로 표시 (클릭 기능 없음, 단순 문자열 검사라 가벼움)
  const PREMIUM_RE = /한경\s?프리미엄/;
  function isHankyungPremium(i){
    return i.source === "한국경제" && (PREMIUM_RE.test(i.title) || PREMIUM_RE.test(i.description || ""));
  }

  list.innerHTML = renderedItems.map((i, idx) => `
    <div class="item ${i.isBreaking ? 'breaking' : ''}">
      <div class="time">${i.pubDate.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}<br>${i.pubDate.toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"})}</div>
      <div>
        <a class="title" href="${i.link}" target="_blank" rel="noopener noreferrer" data-idx="${idx}">${i.title}</a>
        <div class="src">${srcLabel(i)}</div>
      </div>
      <div class="item-actions">
        ${isHankyungPremium(i) ? '<span class="premium-badge">유료</span>' : ''}
        <button class="copy-btn" data-idx="${idx}" title="링크 복사">${copyIcon}</button>
      </div>
    </div>
  `).join("");

  list.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const item = renderedItems[Number(btn.dataset.idx)];
      try{
        await navigator.clipboard.writeText(item.link);
      }catch(e){
        // 클립보드 API를 못 쓰는 환경(예: file:// 일부 브라우저) 대비 폴백
        const ta = document.createElement("textarea");
        ta.value = item.link; document.body.appendChild(ta);
        ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      }
      btn.innerHTML = checkIcon;
      btn.classList.add("copied");
      setTimeout(()=>{ btn.innerHTML = copyIcon; btn.classList.remove("copied"); }, 1200);
    });
  });

  const preview = document.getElementById("previewPanel");
  const closeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  let hoverToken = 0; // 빠르게 여러 기사를 오갈 때 오래된 번역 응답이 늦게 도착해 덮어쓰는 것 방지
  let currentPreviewData = null; // 복사 버튼이 참조할 현재 말풍선 내용
  let currentItemLink = null; // 지금 말풍선에 떠 있는 기사의 링크 (닫기 판별용)
  let dismissedLink = null; // 방금 닫은 기사의 링크 — 이 기사에는 다시 안 뜸

  function dismissPreview(){
    dismissedLink = currentItemLink;
    preview.classList.remove("show");
  }

  function copyPreviewContent(){
    if(!currentPreviewData) return;
    const text = `${currentPreviewData.title} -${currentPreviewData.src}. ${currentPreviewData.body}`;
    const finish = () => {
      const btn = document.getElementById("pvCopyBtn");
      if(!btn) return;
      btn.innerHTML = checkIcon;
      setTimeout(()=>{ if(document.getElementById("pvCopyBtn")) document.getElementById("pvCopyBtn").innerHTML = copyIcon; }, 1200);
    };
    navigator.clipboard.writeText(text).then(finish).catch(()=>{
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      finish();
    });
  }

  list.querySelectorAll("a.title").forEach(el=>{
    el.addEventListener("mouseenter", async ()=>{
      const item = renderedItems[Number(el.dataset.idx)];
      if(!item) return;
      if(item.link && item.link === dismissedLink) return; // 방금 닫았던 기사면 다시 안 띄움

      const myToken = ++hoverToken;
      currentItemLink = item.link;

      const renderPanel = (bodyText) => {
        if(myToken !== hoverToken) return; // 이미 다른 기사로 넘어간 경우 무시
        currentPreviewData = { title: item.title, src: item.press || item.source, body: bodyText.replace(/<[^>]*>/g, "").replace(/^\((무료번역 횟수초과|무료번역 4곳 모두 실패)\)\s*/, "") };
        preview.innerHTML = `
          <div class="pv-header">
            <div class="pv-src">${item.source}${item.lang === "en" ? " · 번역됨" : ""}</div>
            <button class="pv-close-btn" id="pvCloseBtn" title="닫기">${closeIcon}</button>
          </div>
          <div class="pv-scroll">
            <div class="pv-title">${item.title}</div>
            <div class="pv-body">${bodyText}</div>
          </div>
          <div class="pv-footer">
            <button class="pv-copy-btn" id="pvCopyBtn" title="말풍선 내용 복사">${copyIcon}</button>
          </div>
        `;
        preview.classList.add("show");
        document.getElementById("pvCopyBtn").addEventListener("click", copyPreviewContent);
        document.getElementById("pvCloseBtn").addEventListener("click", dismissPreview);
      };

      if(!item.description){
        renderPanel("본문 미리보기를 제공하지 않는 기사입니다. 링크를 눌러 원문을 확인하세요.");
        return;
      }

      if(item.lang === "en"){
        renderPanel(`<span class="pv-loading">번역 중…</span>`);
        const translated = await translateToKo(item.description);
        renderPanel(condenseMarketText(translated));
      }else{
        renderPanel(condenseMarketText(item.description));
      }
    });

    // 커서가 제목에서 떨어져도 말풍선은 사라지지 않고 마지막 내용을 계속 보여줌 (진행 중이던 번역 요청만 취소)
    el.addEventListener("mouseleave", ()=>{
      hoverToken++;
    });
  });

  window.__dismissPreviewViaEsc = dismissPreview;
}

function timeAgo(date){
  const diffMin = Math.floor((Date.now() - date.getTime()) / 60000);
  if(diffMin < 1) return "방금 전";
  if(diffMin < 60) return diffMin + "분 전";
  const diffHour = Math.floor(diffMin / 60);
  if(diffHour < 24) return diffHour + "시간 전";
  return Math.floor(diffHour / 24) + "일 전";
}

// 속보를 localStorage에 최근 3일치 누적 저장 — 이번 주기에 속보가 없어도 최근에 있었던 진짜 속보를 계속 보여주기 위함
const BREAKING_STORE_KEY = "stockNewsBreakingHistory";
const BREAKING_KEEP_MS = 3 * 24 * 60 * 60 * 1000; // 3일

function saveBreakingHistory(newBreakingItems){
  let history = [];
  try{ history = JSON.parse(localStorage.getItem(BREAKING_STORE_KEY) || "[]"); }catch(e){ history = []; }

  const incoming = newBreakingItems.map(i => ({ title: i.title, link: i.link, pubDate: i.pubDate.getTime() }));
  const merged = [...incoming, ...history];

  // 링크 기준 중복 제거 + 3일 지난 것 제외 + 최신순 정렬 + 최대 20개만 보관
  const seen = new Set();
  const cutoff = Date.now() - BREAKING_KEEP_MS;
  const cleaned = merged
    .filter(i => i.pubDate >= cutoff)
    .filter(i => { if(seen.has(i.link)) return false; seen.add(i.link); return true; })
    .sort((a, b) => b.pubDate - a.pubDate)
    .slice(0, 20);

  try{ localStorage.setItem(BREAKING_STORE_KEY, JSON.stringify(cleaned)); }catch(e){ /* 저장 공간 문제 등은 무시 */ }
  return cleaned;
}

function updateTape(){
  // 속보(한글 "속보" 또는 영문 "BREAKING")만 — 3번째 줄
  const tape3 = document.getElementById("tape3");
  const currentBreaking = allItems.filter(i => i.isBreaking);
  const history = saveBreakingHistory(currentBreaking); // 이번에 새로 찾은 속보를 기록에 반영

  let breaking;
  if(currentBreaking.length > 0){
    breaking = currentBreaking.slice(0, 16).map(i => i.title);
  }else if(history.length > 0){
    // 이번 주기엔 속보가 없어도, 최근 3일 안에 있었던 진짜 속보 중 최신 2개를 대신 표시
    breaking = history.slice(0, 2).map(i => i.title);
  }else{
    breaking = allItems.slice(0, 2).map(i => i.title); // 그마저도 없으면 최신 기사 2개로 최종 대체
  }

  tape3.innerHTML = breaking.length
    ? breaking.map(t => `<span>● ${t}</span>`).join("")
    : `<span>표시할 뉴스가 없습니다</span>`;
}

// ==== 시장 지표 소스 우선순위 ====
// 정리: Finnhub/Alpha Vantage/FMP/Polygon/Marketstack/EODHD/Tiingo를 다 확인했는데, 전부 API 키 발급이 필요하고
// 무료 한도도 하루 몇십~몇백 건 수준이라(계속 갱신하는 용도로는 부족), 실제로 "키 없이 무료로 빠르게"를 만족하는 건
// Yahoo Finance의 공개 차트 API였습니다. 공식 API는 아니지만 v8 chart 엔드포인트는 인증 없이 계속 잘 됩니다.
// 그래서 최종 우선순위는: ① Yahoo Finance(지수·유가·나머지 원자재), gold-api.com(금·은·구리), CoinGecko(비트코인),
// Frankfurter(환율) — 전부 무료·키불필요 — ② 그래도 실패하면 Twelve Data로 대체(대체된 항목엔 끝에 흐린 "." 표시)

// 공통: 제한시간을 두고 fetch (한쪽이 느려져도 전체가 밀리지 않도록)
async function fetchWithTimeout(url, ms = 6000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, { signal: controller.signal });
  }finally{
    clearTimeout(timer);
  }
}

function paintSlot(id, html){

}

// 공통 렌더러: 이름/값/등락률. isDollar면 $ 표시, isFallback이면 끝에 흐린 "." 표시 (Twelve Data로 대체됐다는 표시)
function renderQuoteSlot(name, price, pct, opts = {}){
  if(price == null || isNaN(price)){
    return `<span class="mkt"><span class="mkt-name">${name}</span><span class="mkt-val">-</span></span>`;
  }
  const sign = pct > 0 ? "▲" : pct < 0 ? "▼" : "·";
  const cls = pct > 0 ? "up" : pct < 0 ? "down" : "flat";
  const prefix = opts.isDollar ? "$" : (opts.isWon ? "₩" : "");
  const digits = opts.decimals != null ? opts.decimals : 2;
  const valStr = prefix + price.toLocaleString(opts.isDollar ? "en-US" : "ko-KR", { maximumFractionDigits: digits });
  // toFixed(2)로 자리를 맞춘 뒤, parseFloat로 끝의 불필요한 0을 제거 (1.20 → 1.2, 1.00 → 1)
  const pctStr = (pct == null || isNaN(pct)) ? "" : sign + parseFloat(Math.abs(pct).toFixed(2)) + "%";
  const dot = opts.isFallback ? `<span class="mkt-dot">.</span>` : "";
  const closedTag = opts.closed ? `<span class="mkt-dot">(종가)</span>` : "";
  return `<span class="mkt">
    <span class="mkt-name">${name}</span>
    <span class="mkt-val">${valStr}</span>
    <span class="mkt-chg ${cls}">${pctStr}</span>${dot}${closedTag}
  </span>`;
}

// ---- Twelve Data: 최종 폴백 전용 (다른 무료 소스가 다 실패했을 때만 호출) ----
async function fetchTwelveDataFallback(tdSymbol){
  const url = MY_WORKER + "/?td_symbols=" + encodeURIComponent(tdSymbol);
  const res = await fetch(url);
  const data = await res.json();
  const q = data.symbol ? data : data[tdSymbol];
  if(!q || q.status === "error" || q.close == null) return null;
  return { price: parseFloat(q.close), pct: parseFloat(q.percent_change) };
}

  { name: "美10Y국채", ysym: "^TNX",  tdSym: "US10Y", divide10: true },
  { name: "WTI",     ysym: "CL=F",  tdSym: "WTI/USD",      isDollar: true, decimals: 0 },
  { name: "브렌트유", ysym: "BZ=F",  tdSym: "BRENT/USD",    isDollar: true, decimals: 0 },
  { name: "알미늄",   ysym: "ALI=F", tdSym: "ALUMINUM/USD", isDollar: true, decimals: 0 },
  { name: "천연gas",  ysym: "NG=F",  tdSym: "NATGAS/USD",   isDollar: true },
  { name: "美30Y국채", ysym: "^TYX",  tdSym: "US30Y", divide10: true },
];

async function fetchYahooQuote(ticker){
  const targetUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ticker) + "?range=1d&interval=5m";
  const res = await fetchWithTimeout(MY_WORKER + "/?url=" + encodeURIComponent(targetUrl));
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const result = data?.chart?.result?.[0];
  if(!result) throw new Error("데이터 없음");
  const meta = result.meta;
  const price = meta.regularMarketPrice;
  const prevClose = meta.previousClose ?? meta.chartPreviousClose;
  if(price == null || prevClose == null) throw new Error("가격 정보 없음");
  return { price, prevClose, marketState: meta.marketState };
}

async function updateYahooGroup(){
  for(let i = 0; i < YAHOO_GROUP.length; i++){
    const m = YAHOO_GROUP[i];
    const slotId = "mkt-yh-" + i;
    try{
      const { price, prevClose } = await fetchYahooQuote(m.ysym);
      const dispPrice = m.divide10 ? price / 10 : price;
      const pct = ((price - prevClose) / prevClose) * 100;
      paintSlot(slotId, renderQuoteSlot(m.name, dispPrice, pct, { isDollar: m.isDollar, decimals: m.decimals }));
    }catch(e){
      console.error(`[시장 지표 · ${m.name}] Yahoo 실패, Twelve Data로 대체 시도:`, e);
      try{
        const q = await fetchTwelveDataFallback(m.tdSym);
        paintSlot(slotId, q
          ? renderQuoteSlot(m.name, q.price, q.pct, { isDollar: m.isDollar, isFallback: true, decimals: m.decimals })
          : renderQuoteSlot(m.name, null));
      }catch(e2){
        console.error(`[시장 지표 · ${m.name}] Twelve Data 대체도 실패:`, e2);
      }
    }
    if(i < YAHOO_GROUP.length - 1) await delay(300); // 너무 몰아서 보내지 않도록 약간의 간격
  }
}

// ==== 금·은·구리: ① Yahoo Finance ② gold-api.com ③ Twelve Data 순으로 시도 ====
const METALS = [
  { name: "금",   ysym: "GC=F", giSym: "XAU", tdSym: "XAU/USD", decimals: 0 },
  { name: "은",   ysym: "SI=F", giSym: "XAG", tdSym: "XAG/USD" },
  { name: "구리", ysym: "HG=F", giSym: "HG",  tdSym: "COPPER/USD" },
];
const metalsPrevPrice = {}; // gold-api는 등락률을 안 줘서, 직전 값과 비교해 등락 표시

async function updateMetals(){
  for(let i = 0; i < METALS.length; i++){
    const m = METALS[i];
    const slotId = "mkt-metal-" + i;

    // 1순위: Yahoo Finance
    try{
      const { price, prevClose } = await fetchYahooQuote(m.ysym);
      const pct = ((price - prevClose) / prevClose) * 100;
      paintSlot(slotId, renderQuoteSlot(m.name, price, pct, { isDollar: true, decimals: m.decimals }));
      continue;
    }catch(e){
      console.error(`[시장 지표 · ${m.name}] Yahoo 실패, gold-api로 대체 시도:`, e);
    }

    // 2순위: gold-api.com
    try{
      const res = await fetchWithTimeout("https://api.gold-api.com/price/" + m.giSym);
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const price = parseFloat(data.price);
      if(isNaN(price)) throw new Error("가격 없음");
      const prev = metalsPrevPrice[m.giSym];
      const pct = prev ? ((price - prev) / prev) * 100 : null;
      metalsPrevPrice[m.giSym] = price;
      paintSlot(slotId, renderQuoteSlot(m.name, price, pct, { isDollar: true, decimals: m.decimals }));
      continue;
    }catch(e){
      console.error(`[시장 지표 · ${m.name}] gold-api도 실패, Twelve Data로 대체 시도:`, e);
    }

    // 3순위: Twelve Data
    try{
      const q = await fetchTwelveDataFallback(m.tdSym);
      paintSlot(slotId, q
        ? renderQuoteSlot(m.name, q.price, q.pct, { isDollar: true, isFallback: true, decimals: m.decimals })
        : renderQuoteSlot(m.name, null));
    }catch(e2){
      console.error(`[시장 지표 · ${m.name}] Twelve Data 대체도 실패:`, e2);
    }
  }
}

// ==== 비트코인: CoinGecko 우선(무료, 사실상 무제한), 실패하면 Twelve Data로 대체 ====
async function updateBitcoin(){
  try{
    const res = await fetchWithTimeout("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const price = data?.bitcoin?.usd;
    const pct = data?.bitcoin?.usd_24h_change;
    if(price == null) throw new Error("가격 없음");
    paintSlot("mkt-btc", renderQuoteSlot("Bitcoin", price, pct, { isDollar: true }));
  }catch(e){
    console.error("[시장 지표 · bitcoin] CoinGecko 실패, Twelve Data로 대체 시도:", e);
    try{
      const q = await fetchTwelveDataFallback("BTC/USD");
      paintSlot("mkt-btc", q
        ? renderQuoteSlot("Bitcoin", q.price, q.pct, { isDollar: true, isFallback: true })
        : renderQuoteSlot("Bitcoin", null));
    }catch(e2){
      console.error("[시장 지표 · bitcoin] Twelve Data 대체도 실패:", e2);
    }
  }
}

// ==== 환율: ① Yahoo Finance ② Frankfurter.app ③ Twelve Data 순으로 시도 ====
let forexPrevRate = null;
let latestForexRate = null; // 한국 ADR을 원화로 환산할 때 쓰는 최신 환율
async function updateForex(){
  // 1순위: Yahoo Finance (KRW=X)
  try{
    const { price, prevClose } = await fetchYahooQuote("KRW=X");
    const pct = ((price - prevClose) / prevClose) * 100;
    latestForexRate = price;
    paintSlot("mkt-forex", renderQuoteSlot("환율", price, pct, { decimals: 0 }));
    return;
  }catch(e){
    console.error("[시장 지표 · 환율] Yahoo 실패, Frankfurter로 대체 시도:", e);
  }

  // 2순위: Frankfurter.app
  try{
    const res = await fetchWithTimeout("https://api.frankfurter.dev/v1/latest?from=USD&to=KRW");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const rate = data?.rates?.KRW;
    if(rate == null) throw new Error("환율 값 없음");
    const prev = forexPrevRate;
    const pct = prev ? ((rate - prev) / prev) * 100 : null;
    forexPrevRate = rate;
    latestForexRate = rate;
    paintSlot("mkt-forex", renderQuoteSlot("환율", rate, pct, { decimals: 0 }));
    return;
  }catch(e){
    console.error("[시장 지표 · 환율] Frankfurter도 실패, Twelve Data로 대체 시도:", e);
  }

  // 3순위: Twelve Data
  try{
    const q = await fetchTwelveDataFallback("USD/KRW");
    if(q) latestForexRate = q.price;
    paintSlot("mkt-forex", q
      ? renderQuoteSlot("환율", q.price, q.pct, { isFallback: true, decimals: 0 })
      : renderQuoteSlot("환율", null));
  }catch(e2){
    console.error("[시장 지표 · 환율] Twelve Data 대체도 실패:", e2);
  }
}

// ==== 초기 배치: 페이지 열리자마자 순서대로 이름부터 다 표시 (왼쪽 사이드바에 세로로 한 줄씩) ====
// 순서: 코스피·코스닥·나스닥·나선·S&P·반도체·환율·美10Y·WTI·브렌트유·금·은·구리·알미늄·천연gas·bitcoin
// ==== 한국 ADR (미국 상장 한국 기업 예탁증서) — 야후에서 달러가로 가져와 환율로 원화 환산 ====
// 장이 열려있을 때(marketState !== "CLOSED")는 방금 갱신한 실시간 환율로 계산하고,
// 장이 닫혀있어 가격이 그대로면 "(종가)" 표시를 붙임 — 다만 환율 자체는 계속 갱신되는 최신값을 씀
// (정확한 "마감 시각의 환율"까지 과거로 되돌려 계산하는 건 무료로는 불가능해서, 현실적인 절충으로 최신 환율을 씁니다)
const ADR_LIST = [
  { name: "SK하닉",   ysym: "SKHY" },
  { name: "KB금융",   ysym: "KB" },
  { name: "신한지주", ysym: "SHG" },
  { name: "포홀",     ysym: "PKX" },
  { name: "SK텔레콤", ysym: "SKM" },
  { name: "KT",       ysym: "KT" },
  { name: "한국전력", ysym: "KEP" },
  { name: "LG디스플", ysym: "LPL" },
  { name: "그래비티", ysym: "GRVY" },
];

async function updateAdrs(){
  if(latestForexRate == null) return; // 환율을 아직 못 가져왔으면 이번 회차는 건너뜀
  for(let i = 0; i < ADR_LIST.length; i++){
    const m = ADR_LIST[i];
    const slotId = "mkt-adr-" + i;
    try{
      const { price, prevClose, marketState } = await fetchYahooQuote(m.ysym);
      const pct = ((price - prevClose) / prevClose) * 100;
      const krw = price * latestForexRate;
      // marketState가 확실히 "CLOSED"로 온 경우에만 종가 표시. 값이 비어있거나(불확실) PRE/REGULAR/POST/PREPRE/POSTPOST 등
      // 실제 거래가 있을 수 있는 상태에서는 종가로 잘못 표시하지 않도록 함
      const isClosed = marketState === "CLOSED";
      paintSlot(slotId, renderQuoteSlot(m.name, krw, pct, { isWon: true, decimals: 0, closed: isClosed }));
    }catch(e){
      console.error(`[한국 ADR · ${m.name}] 로딩 실패:`, e);
    }
    if(i < ADR_LIST.length - 1) await delay(200);
  }
}

    ...YAHOO_GROUP.slice(2, 6).map((m, i) => `<span id="mkt-yh-${i+2}">${renderQuoteSlot(m.name, null)}</span>`),

    `<span id="mkt-yh-9">${renderQuoteSlot(YAHOO_GROUP[9].name, null)}</span>`,
    `<span id="mkt-yh-10">${renderQuoteSlot(YAHOO_GROUP[10].name, null)}</span>`,
    `<span id="mkt-btc">${renderQuoteSlot("Bitcoin", null)}</span>`,
    `<div class="mkt-divider">한국 ADR</div>`,
    ...ADR_LIST.map((m, i) => `<span id="mkt-adr-${i}">${renderQuoteSlot(m.name, null)}</span>`),
  ];
  document.getElementById("marketSidebar").innerHTML = items.join("");
}

renderPlaceholders();

// 최초 로딩 순서: 지수 → 환율 → ADR을 먼저 끝내고, 그 다음에 본문 뉴스(loadAll)를 시작
// (그 이후의 반복 갱신은 서로 안 기다리고 각자 주기대로 돎)
(async function initialMarketLoad(){
  await updateYahooGroup();
  await updateForex();
  await updateAdrs();
  updateMetals();
  updateBitcoin();
  loadAll();
})();

setInterval(updateYahooGroup, 30 * 1000); // Yahoo 그룹(지수·유가·알루미늄·천연가스): 30초마다 순차 조회
setInterval(updateMetals, 10 * 1000);     // 금·은·구리: 10초마다 (최대한 빠르게)
setInterval(updateForex, 10 * 1000);      // 환율: 10초마다 (최대한 빠르게)
setInterval(updateBitcoin, 15 * 1000);    // 비트코인: 15초마다
setInterval(updateAdrs, 20 * 1000);       // 한국 ADR: 20초마다 (환율이 먼저 준비된 뒤에 계산)
setInterval(loadAll, REFRESH_MS);

// ---- ESC 키로 미리보기 말풍선 닫기 ----
window.addEventListener("keydown", (e) => {
  if(e.key !== "Escape") return;
  if(window.__dismissPreviewViaEsc) window.__dismissPreviewViaEsc();
});

// ---- 커서가 탭+뉴스 목록 영역을 완전히 벗어나면 말풍선 자동으로 닫기 ----
const contentArea = document.getElementById("contentArea");
if(contentArea){
  contentArea.addEventListener("mouseleave", () => {
    if(window.__dismissPreviewViaEsc) window.__dismissPreviewViaEsc();
  });
}

// ---- F5 새로고침에 5초 딜레이 적용 (버튼은 없앰) ----
let lastLoadTime = 0;
window.addEventListener("keydown", (e) => {
  const isRefreshKey = e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r");
  if(!isRefreshKey) return;
  e.preventDefault(); // 브라우저의 실제 새로고침(전체 페이지 리로드) 대신 아래 로직으로 대체
  const elapsed = Date.now() - lastLoadTime;
  if(elapsed < 5000){
    document.getElementById("diag").textContent = `너무 빠릅니다 — ${Math.ceil((5000 - elapsed)/1000)}초 후 다시 시도하세요.`;
    return;
  }
  loadAll();
});
</script>
